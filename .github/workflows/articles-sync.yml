# Regenerate the articles section from github.com/mariobgsp/articles and publish it.
#
# The bot runs the owner's own sync command: it commits regenerated bytes to
# develop, then fast-forwards main from develop, so main stays an
# ancestor-or-equal of develop and the documented
# `git merge --ff-only develop` stays a no-op.
#
# The consequence worth knowing: a fast-forward carries every pending develop
# commit with it, not only the generated bytes. An article change therefore also
# publishes code that was sitting on develop, exactly as if the owner had run the
# sync command at that moment. Nothing reaches main that the owner did not write
# or that the generator did not produce; what the owner gives up is control over
# *when* pending code goes live, because an article push triggers the flush.
#
# One way to regenerate. This workflow runs exactly what a human runs:
#
#     git -C ../articles pull
#     python3 tools/build-articles.py
#     python3 tools/build-articles.py --check
#
# It adds no transform of its own. ARTICLES_SRC moves the source path, nothing
# else.
#
# Two facts about the GitHub side, both easy to trip over:
#
#   * `schedule` and `repository_dispatch` only run the copy of a workflow that
#     exists on the repository's *default* branch (main). Until this file is on
#     main, only a manual workflow_dispatch can run it. Once the bot has
#     fast-forwarded main, main's copy stays current by itself.
#   * A push made with GITHUB_TOKEN does not trigger other workflow runs, and
#     does not reliably trigger the Pages branch build either. The deploy step
#     below is therefore explicit: it asks Pages to build from main, rather
#     than waiting for the push to be noticed.
#
# If the repository is quiet for 60 days GitHub disables the schedule; any
# commit, or one manual run from the Actions tab, turns it back on.

name: articles-sync

on:
  schedule:
    - cron: "17 * * * *" # hourly; the floor that needs no secret
  repository_dispatch:
    # Optional accelerator, for a seconds-latency publish. Requires a token with
    # write access to this repository stored in mariobgsp/articles, plus a few
    # lines of workflow there to POST this event. Without it, cron is the only
    # path.
    types: [articles-updated]
  workflow_dispatch:
    inputs:
      force_publish:
        description: Redeploy even when the regeneration produced no change
        type: boolean
        default: false

permissions:
  contents: write # commit the generated bytes to develop, fast-forward main
  pages: write # ask Pages to build from main

concurrency:
  group: articles-sync
  cancel-in-progress: false # one publisher at a time; never abort a half-run

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      ARTICLES_SRC: ${{ github.workspace }}/.articles-src
    steps:
      - name: Check out the site
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0 # main has to be reachable to fast-forward it

      - name: Start from the tip of develop
        run: |
          set -euo pipefail
          git fetch origin develop
          git rebase origin/develop

      - name: Check out mariobgsp/articles
        uses: actions/checkout@v4
        with:
          repository: mariobgsp/articles
          ref: main
          path: .articles-src
        # A failure here (network, rename, made private) stops the job before
        # anything is generated, so the live site keeps serving its last bytes.

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate pages, hub, home index, sitemap and images
        run: python3 tools/build-articles.py
        # A missing source, an unreadable checkout, a facts row that does not
        # parse, or text that did not survive rendering exits non-zero here --
        # before any git add, so the repository is left untouched.

      - name: Assert the regeneration is a fixed point
        run: python3 tools/build-articles.py --check
        # Must pass immediately after a write. A failure means generating twice
        # disagrees with generating once, so nothing is committed.

      - name: Publish
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "no generated change; nothing to publish"
            echo "pushed_main=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m \
            'content(articles): sync generated pages from mariobgsp/articles'
          git push origin HEAD:develop
          # main only ever fast-forwards from develop, which is why the sync
          # stays a no-op for the owner. It also means pending develop commits
          # ride along.
          if git merge-base --is-ancestor origin/main HEAD; then
            git push origin HEAD:main
            echo "pushed_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed_main=false" >> "$GITHUB_OUTPUT"
            # Green here would mean a silently frozen site: develop moved, main
            # did not, and the deploy below is skipped. Fail after the develop
            # push, so the queue still drains and the fix is named.
            echo "::error::main diverged; the site was NOT updated."
            echo "::error::Fix: git switch main && git merge --ff-only develop"
            exit 1
          fi

      - name: Ask Pages to build from main
        if: steps.publish.outputs.pushed_main == 'true' || inputs.force_publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The documented equivalent of "pushing a commit to the default
          # branch". If Pages is not branch-deployed this fails loudly, rather
          # than leaving a green run over a frozen site.
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/pages/builds" --silent
          echo "requested a Pages build from main"
